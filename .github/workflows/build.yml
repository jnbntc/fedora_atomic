name: Fedora Atomic Core - Build & SecScan

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC / 19:00 ART
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fedora_atomic
  CACHE_REPO: ghcr.io/${{ github.repository_owner }}/fedora_atomic/cache
  IMAGE_TAG: latest

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: COMPILACIÓN, ESCANEO Y DESPLIEGUE INMUTABLE
  # -------------------------------------------------------------------------
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Autenticación OCI temprana
      - name: Login to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # 2. Compilación con Cache-Buster dinámico, etiquetas OCI y reintentos
      - name: Build OCI Image with Podman
        run: |
          DATE_TAG=$(date +%Y%m%d)
          EPOCH_TIME=$(date +%s)
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV

          n=0
          max=3
          until [ $n -ge $max ]; do
            podman build \
              --pull=always \
              --security-opt seccomp=unconfined \
              --security-opt label=disable \
              --cap-add=ALL \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.description=Fedora Atomic Core Inmutable" \
              --build-arg CACHE_BUSTER=${EPOCH_TIME} \
              --cache-to=${{ env.CACHE_REPO }} \
              --cache-from=${{ env.CACHE_REPO }} \
              -f Containerfile \
              -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
              -t ${{ env.IMAGE_NAME }}:${DATE_TAG} . && break
            n=$((n+1))
            echo "::warning::Fallo en la transacción RPM o red. Reintentando en 15 segundos (Intento $n/$max)..."
            sleep 15
          done

          # Validación de integridad del artefacto antes de exportar
          podman image exists ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || exit 1
          
          # Exportación acelerada en formato OCI Archive para mitigar sobrecarga de I/O en GitHub Actions
          # podman save --format oci-archive -o fedora-atomic.tar ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          podman save --format docker-archive -o fedora-atomic.tar ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
      # 3. Escaneo de vulnerabilidades no bloqueante sobre el archivo OCI Archive local
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: 'fedora-atomic.tar'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'

      # 4. Despliegue unificado de tags inmutables y flotantes post-validación
      - name: Push Verified Image
        run: |
          podman push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          podman push ${{ env.IMAGE_NAME }}:${{ env.DATE_TAG }}

  # -------------------------------------------------------------------------
  # JOB 2: LIMPIEZA ASÍNCRONA DEL REGISTRO (RETENCIÓN Y PURGA)
  # -------------------------------------------------------------------------
  cleanup-registry:
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    
    steps:
      - name: Prune untagged and old container versions via GH CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          clean_package() {
            local PKG_NAME=$1
            echo "::group::Limpiando paquete: ${PKG_NAME}"
            
            # 1. Obtener los IDs (Con paginación forzada para evitar el punto ciego de los 100 registros)
            local VERSIONS
            VERSIONS=$(gh api --paginate -H "Accept: application/vnd.github+json" \
              "/users/${OWNER}/packages/container/${PKG_NAME}/versions?per_page=100" 2>/dev/null || echo "[]")

            if [ "$VERSIONS" = "[]" ] || [ -z "$VERSIONS" ]; then
              echo "No se encontraron versiones o el paquete ${PKG_NAME} no existe."
              echo "::endgroup::"
              return
            fi

            # Normalizar múltiples páginas devueltas por la API en un solo array de JSON
            VERSIONS=$(echo "${VERSIONS}" | jq -s 'flatten')

            # 2. Purgar versiones que perdieron todas sus etiquetas (Untagged)
            echo "--> Buscando imágenes sin etiquetas (untagged)..."
            echo "${VERSIONS}" | jq -c '.[] | select(.metadata.container.tags == [])' | while read -r row; do
              ID=$(echo "${row}" | jq -r '.id')
              UPDATED=$(echo "${row}" | jq -r '.updated_at')
              echo "Borrando versión untagged ID: ${ID} (Última mod: ${UPDATED})..."
              gh api --method DELETE "/users/${OWNER}/packages/container/${PKG_NAME}/versions/${ID}" 2>/dev/null || true
            done

            # 3. Purgar versiones con etiquetas antiguas (>14 días), preservando 'latest' y reteniendo las últimas 5
            if [ "${PKG_NAME}" = "fedora_atomic" ]; then
              echo "--> Buscando builds inmutables antiguos (>14 días)..."
              
              CUTOFF_DATE=$(date -u -d "14 days ago" +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u -v-14d +"%Y-%m-%dT%H:%M:%SZ")
              
              echo "${VERSIONS}" | jq -c --arg cutoff "${CUTOFF_DATE}" '
                [ .[] | select(.metadata.container.tags != [] and (.metadata.container.tags | index("latest") | not) and .updated_at < $cutoff) ] 
                | sort_by(.updated_at) 
                | reverse 
                | .[5:] // [] | .[]
              ' | while read -r row; do
                ID=$(echo "${row}" | jq -r '.id')
                TAGS=$(echo "${row}" | jq -r '.metadata.container.tags | join(", ")')
                echo "Borrando build antiguo ID: ${ID} [Tags: ${TAGS}]..."
                gh api --method DELETE "/users/${OWNER}/packages/container/${PKG_NAME}/versions/${ID}" 2>/dev/null || true
              done
            fi

            echo "::endgroup::"
          }

          clean_package "fedora_atomic"
          clean_package "fedora_atomic%2Fcache"
