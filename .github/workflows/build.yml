name: Fedora Atomic Core - Build & Security Gate

on:
  push:
    branches:
      - main
    paths:
      - Containerfile
      - .github/workflows/build.yml
      - .github/workflows/promote-stable.yml
      - files/**
      - security/**
      - scripts/security/**
      - scripts/smoke/**
      - scripts/publish/**
  schedule:
    - cron: '17 22 * * *' # 22:17 UTC / 19:17 ART
  workflow_dispatch:

concurrency:
  group: fedora-atomic-${{ github.ref == 'refs/heads/main' && 'release' || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fedora_atomic
  CACHE_REPO: ghcr.io/${{ github.repository_owner }}/fedora_atomic/cache
  IMAGE_TAG: latest

jobs:
  build-scan-push:
    name: Build, scan & publish immutable identity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.identity.outputs.digest }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build OCI Image with Podman
        shell: bash
        run: |
          set -Eeuo pipefail

          DATE_TAG="$(date -u +%Y%m%d)"
          CACHE_BUSTER="${DATE_TAG}"
          echo "DATE_TAG=${DATE_TAG}" >> "${GITHUB_ENV}"

          cache_args=(--cache-from="${CACHE_REPO}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            cache_args+=(--cache-to="${CACHE_REPO}")
          fi

          n=0
          max=3
          until [[ $n -ge $max ]]; do
            if podman build \
              --pull=always \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.description=Fedora Atomic Core Inmutable" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --build-arg CACHE_BUSTER="${CACHE_BUSTER}" \
              "${cache_args[@]}" \
              -f Containerfile \
              -t "${IMAGE_NAME}:${IMAGE_TAG}" \
              -t "${IMAGE_NAME}:${DATE_TAG}" .; then
              break
            fi

            n=$((n + 1))
            if [[ $n -ge $max ]]; then
              echo "::error::Build falló tras ${max} intentos."
              exit 1
            fi

            echo "::warning::Fallo en la transacción RPM o red. Reintentando en 15 segundos (Intento $((n + 1))/${max})..."
            sleep 15
          done

          podman image exists "${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Export squashed rootfs
        shell: bash
        run: |
          set -Eeuo pipefail

          cid="$(podman create "${IMAGE_NAME}:${IMAGE_TAG}")"
          trap 'podman rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          rm -rf rootfs security-evidence
          mkdir -p rootfs security-evidence
          podman export "$cid" | tar -x -C rootfs

          test -f rootfs/usr/lib/os-release
          test -f rootfs/usr/share/rpm/rpmdb.sqlite

      - name: Artifact Smoke Tests
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/smoke/test-image.sh \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            rootfs \
            files/etc \
            2>&1 | tee security-evidence/artifact-smoke.txt

      - name: Download pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0

      - name: Generate SPDX and CycloneDX SBOMs
        shell: bash
        run: |
          set -Eeuo pipefail

          "${{ steps.syft.outputs.cmd }}" dir:rootfs \
            -o spdx-json=security-evidence/sbom.spdx.json \
            -o cyclonedx-json=security-evidence/sbom.cyclonedx.json

          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' \
            security-evidence/sbom.spdx.json >/dev/null

          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
            security-evidence/sbom.cyclonedx.json >/dev/null

          rpm_packages="$(
            jq '[
              .packages[]?
              | select(
                  any(
                    .externalRefs[]?;
                    .referenceType == "purl"
                    and (.referenceLocator | startswith("pkg:rpm/"))
                  )
                )
            ] | length' security-evidence/sbom.spdx.json
          )"

          echo "RPM packages in SBOM: ${rpm_packages}"
          (( rpm_packages > 0 ))

          jq '
            del(.files)
            | .packages |= map(
                del(.sourceInfo, .originator, .packageVerificationCode, .checksums)
                | if has("externalRefs") then
                    .externalRefs |= map(select(.referenceType == "purl"))
                  else . end
              )
            | .relationships |= map(select(.relationshipType == "DESCRIBES"))
          ' security-evidence/sbom.spdx.json \
            > security-evidence/sbom.attest.spdx.json

          full_packages="$(jq '.packages | length' security-evidence/sbom.spdx.json)"
          attest_packages="$(jq '.packages | length' security-evidence/sbom.attest.spdx.json)"
          attest_bytes="$(stat -c '%s' security-evidence/sbom.attest.spdx.json)"

          [[ "${full_packages}" -eq "${attest_packages}" ]]
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' \
            security-evidence/sbom.attest.spdx.json >/dev/null
          (( attest_bytes < 16777216 ))

          echo "Attestation SPDX packages: ${attest_packages}"
          echo "Attestation SPDX size: ${attest_bytes} bytes"

      - name: Download pinned Grype
        id: grype
        uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          grype-version: v0.119.0
          cache-db: true

      - name: Grype advisory scan of SBOM
        shell: bash
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -Eeuo pipefail

          "${{ steps.grype.outputs.cmd }}" sbom:security-evidence/sbom.spdx.json \
            --by-cve \
            --output json \
            --file security-evidence/grype-advisory.json

          jq -e '.distro.name == "fedora" and .distro.version == "44"' \
            security-evidence/grype-advisory.json >/dev/null

          jq '{
            distro: .distro,
            total_matches: (.matches | length),
            by_severity: (
              [.matches[]?.vulnerability.severity]
              | group_by(.)
              | map({key: .[0], value: length})
              | from_entries
            ),
            namespaces: ([.matches[]?.vulnerability.namespace] | unique)
          }' security-evidence/grype-advisory.json \
            | tee security-evidence/grype-summary.json

      - name: Query Fedora native security advisories
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_name="$(jq -r '.expected_distro.name' security/vulnerability-policy.json)"
          expected_version="$(jq -r '.expected_distro.version' security/vulnerability-policy.json)"

          podman run --rm \
            -e EXPECTED_NAME="${expected_name}" \
            -e EXPECTED_VERSION="${expected_version}" \
            -v "${PWD}/security-evidence:/evidence" \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            bash -lc '
              set -Eeuo pipefail
              . /usr/lib/os-release

              [[ "$ID" == "$EXPECTED_NAME" ]]
              [[ "$VERSION_ID" == "$EXPECTED_VERSION" ]]
              test -f /usr/share/rpm/rpmdb.sqlite

              dnf5 --refresh advisory list \
                --available \
                --security \
                --with-cve \
                --json > /evidence/fedora-security-advisories.json
            '

          jq -e 'type == "array"' security-evidence/fedora-security-advisories.json >/dev/null

      - name: Evaluate Fedora security gate
        id: fedora_gate
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/security/evaluate-fedora-advisories.sh \
            security-evidence/fedora-security-advisories.json \
            security/vulnerability-policy.json \
            2>&1 | tee security-evidence/fedora-security-gate.txt

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-atomic-security-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            security-evidence/sbom.spdx.json
            security-evidence/sbom.attest.spdx.json
            security-evidence/sbom.cyclonedx.json
            security-evidence/grype-advisory.json
            security-evidence/grype-summary.json
            security-evidence/fedora-security-advisories.json
            security-evidence/fedora-security-gate.txt
            security-evidence/artifact-smoke.txt
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6

      - name: Enforce Fedora Security Gate
        if: steps.fedora_gate.outcome == 'failure'
        run: |
          echo "::error::El gate de seguridad Fedora bloqueó la publicación. Revisar el artefacto fedora-atomic-security-${{ github.sha }}-${{ github.run_attempt }}."
          exit 1

      - name: Publish Immutable Image Identity
        id: identity
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail

          bash scripts/publish/publish-image.sh \
            --local-image "${IMAGE_NAME}:${IMAGE_TAG}" \
            --repository "${IMAGE_NAME}" \
            --date "${DATE_TAG}" \
            --revision "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --identity-file security-evidence/image-identity.json \
            --defer-channels

          digest="$(jq -r '.digest' security-evidence/image-identity.json)"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Upload Image Identity
        if: github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-atomic-identity-${{ github.sha }}-${{ github.run_attempt }}
          path: security-evidence/image-identity.json
          retention-days: 90
          if-no-files-found: error
          compression-level: 6

  sign-attest-publish:
    name: Sign, attest, verify & publish channels
    needs: build-scan-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_DIGEST: ${{ needs.build-scan-push.outputs.image_digest }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR for Sigstore tooling
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Download canonical security evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fedora-atomic-security-${{ github.sha }}-${{ github.run_attempt }}
          path: security-evidence
          digest-mismatch: error

      - name: Validate signing inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -e '.spdxVersion == "SPDX-2.3"' security-evidence/sbom.attest.spdx.json >/dev/null
          (( $(stat -c '%s' security-evidence/sbom.attest.spdx.json) < 16777216 ))
          echo "IMAGE_REF=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "${GITHUB_ENV}"

      - name: Keyless sign image digest
        shell: bash
        run: |
          set -Eeuo pipefail
          cosign sign --yes "${IMAGE_REF}"

      - name: Attest SLSA build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Attest canonical SPDX SBOM
        id: sbom_attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: security-evidence/sbom.attest.spdx.json
          push-to-registry: true

      - name: Collect attestation bundles
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p signing-evidence

          cp "${{ steps.provenance.outputs.bundle-path }}" signing-evidence/provenance.bundle.jsonl
          cp "${{ steps.sbom_attestation.outputs.bundle-path }}" signing-evidence/sbom.bundle.jsonl

      - name: Verify signature and attestations
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash scripts/security/verify-signed-image.sh \
            --repository "${IMAGE_NAME}" \
            --digest "${IMAGE_DIGEST}" \
            --revision "${GITHUB_SHA}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --evidence-dir signing-evidence

      - name: Publish candidate and latest
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/publish/publish-channels.sh \
            --repository "${IMAGE_NAME}" \
            --revision "${GITHUB_SHA}" \
            --digest "${IMAGE_DIGEST}" \
            --evidence-file signing-evidence/channel-publication.json

      - name: Upload signing and provenance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-atomic-supply-chain-${{ github.sha }}-${{ github.run_attempt }}
          path: signing-evidence/**
          retention-days: 90
          if-no-files-found: warn
          compression-level: 6
