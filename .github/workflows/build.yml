name: Fedora Atomic Core - Build & SecScan

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC / 19:00 ART
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fedora_atomic
  CACHE_REPO: ghcr.io/${{ github.repository_owner }}/fedora_atomic/cache
  IMAGE_TAG: latest

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Autenticación OCI temprana (Obligatorio para leer/escribir blobs en el namespace de caché)
      - name: Login to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # 2. Compilación con política de reintentos ante fallos de CDN/red (máx 3 intentos)
      - name: Build OCI Image with Podman
        run: |
          DATE_TAG=$(date +%Y%m%d)
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV

          n=0
          max=3
          until [ $n -ge $max ]; do
            podman build \
              --pull=always \
              --cache-to=${{ env.CACHE_REPO }} \
              --cache-from=${{ env.CACHE_REPO }} \
              -f Containerfile \
              -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
              -t ${{ env.IMAGE_NAME }}:${DATE_TAG} . && break
            n=$((n+1))
            echo "::warning::Fallo en la descarga OCI. Reintentando en 15 segundos (Intento $n/$max)..."
            sleep 15
          done

          podman image exists ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || exit 1
          podman save -o fedora-atomic.tar ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 4. Despliegue de ambos tags (flotante e inmutable)
      - name: Push Verified Image
        run: |
          podman push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          podman push ${{ env.IMAGE_NAME }}:${{ env.DATE_TAG }}
      # 3. Escaneo no bloqueante para evitar caídas por CVEs upstream sin parche en Fedora
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: 'fedora-atomic.tar'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'

      # 4. Despliegue de la imagen final (Los blobs de caché ya fueron empujados por --cache-to en el Paso 2)
      - name: Push Verified Image
        run: |
          podman push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
