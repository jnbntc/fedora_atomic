name: Fedora Atomic Core - Build & SecScan

on:
  schedule:
    - cron: '0 3 * * *' # Ejecución Nightly (3:00 AM UTC)
  workflow_dispatch:      # Permite disparo manual desde la UI de GitHub

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fedora_atomic
  IMAGE_TAG: latest

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Compilación en entorno efímero (sin empujar al registro todavía)
      - name: Build OCI Image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      # 2. Inyección de Trivy (El Gatekeeper)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'          # Retorna exit 1 (rompe el pipeline) si detecta la amenaza
          ignore-unfixed: true    # REGLA CRÍTICA DE ARQUITECTURA
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 3. Autenticación y Despliegue (Solo si Trivy retorna exit 0)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Verified Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
