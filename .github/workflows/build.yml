name: Fedora Atomic Core - Build & SecScan

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC / 19:00 ART
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fedora_atomic
  CACHE_REPO: ghcr.io/${{ github.repository_owner }}/fedora_atomic/cache
  IMAGE_TAG: latest

jobs:
  # -------------------------------------------------------------------------
  # JOB 1: COMPILACIÓN, ESCANEO Y DESPLIEGUE INMUTABLE
  # -------------------------------------------------------------------------
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Autenticación OCI temprana (Obligatorio para leer/escribir blobs en el namespace de caché)
      - name: Login to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # 2. Compilación con Cache-Buster dinámico y reintentos ante fallos de CDN/red (máx 3 intentos)
      - name: Build OCI Image with Podman
        run: |
          DATE_TAG=$(date +%Y%m%d)
          echo "DATE_TAG=${DATE_TAG}" >> $GITHUB_ENV

          n=0
          max=3
          until [ $n -ge $max ]; do
            podman build \
              --pull=always \
              --build-arg CACHE_BUSTER=${DATE_TAG} \
              --cache-to=${{ env.CACHE_REPO }} \
              --cache-from=${{ env.CACHE_REPO }} \
              -f Containerfile \
              -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
              -t ${{ env.IMAGE_NAME }}:${DATE_TAG} . && break
            n=$((n+1))
            echo "::warning::Fallo en la descarga OCI o CDN. Reintentando en 15 segundos (Intento $n/$max)..."
            sleep 15
          done

          # Validación de integridad del artefacto antes de exportar
          podman image exists ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || exit 1
          podman save -o fedora-atomic.tar ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 3. Escaneo de vulnerabilidades no bloqueante sobre el tarball local en el runner
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: 'fedora-atomic.tar'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'

      # 4. Despliegue unificado de tags inmutables y flotantes post-validación
      - name: Push Verified Image
        run: |
          podman push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          podman push ${{ env.IMAGE_NAME }}:${{ env.DATE_TAG }}

  # -------------------------------------------------------------------------
  # JOB 2: LIMPIEZA ASÍNCRONA DEL REGISTRO (RETENCIÓN Y PURGA)
  # -------------------------------------------------------------------------
  cleanup-registry:
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    
    steps:
      # A. Purga instantánea de todas las capas huérfanas (untagged) en imagen y caché
      - name: Delete untagged images and orphan cache blobs
        uses: snok/container-retention-policy@v3
        with:
          account-type: personal
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: fedora_atomic, fedora_atomic/cache
          cut-off: 0s
          timestamp-to-use: updated_at
          untagged-only: true
          keep-at-least: 1
          skip-tags: latest

      # B. Rotación de historial: Borra tags inmutables de fecha con más de 14 días (conserva al menos 5)
      - name: Prune old dated builds (>14 days)
        uses: snok/container-retention-policy@v3
        with:
          account-type: personal
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: fedora_atomic
          cut-off: 14d
          timestamp-to-use: updated_at
          keep-at-least: 5
          skip-tags: latest
