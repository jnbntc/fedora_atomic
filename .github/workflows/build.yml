name: Fedora Atomic Core - Build & SecScan

on:
  schedule:
    - cron: '0 22 * * *' # 22:00 UTC / 19:00 ART
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fedora_atomic
  IMAGE_TAG: latest

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Autenticación OCI temprana (Permite a Podman descargar el --cache-from desde GHCR sin error de permisos)
      - name: Login to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # 2. Compilación con motor nativo (Podman) usando sintaxis de caché directa
      - name: Build OCI Image with Podman
        run: |
          podman build \
            --cache-to=${{ env.IMAGE_NAME }}:buildcache \
            --cache-from=${{ env.IMAGE_NAME }}:buildcache \
            -f Containerfile -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          # Exportamos la imagen a un tarball inmutable para el escáner
          podman save -o fedora-atomic.tar ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 3. Inyección de Trivy (El Gatekeeper afinado para SO con contingencia)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: 'fedora-atomic.tar'
          format: 'table'
          exit-code: '0'               # Evita bloquear el deployment por CVEs upstream sin parche inmediato en repos RPM
          ignore-unfixed: true
          vuln-type: 'os'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'

      # 4. Despliegue seguro de la imagen y del artefacto de caché
      - name: Push Verified Image & Build Cache
        run: |
          podman push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          podman push ${{ env.IMAGE_NAME }}:buildcache || true
