name: Fedora Atomic Core - Build & SecScan

on:
  schedule:
    - cron: '0 21 * * *' # 21:00 UTC / 18:00 ART
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fedora_atomic
  IMAGE_TAG: latest

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Autenticación OCI temprana (Obligatorio para que Podman pueda descargar --cache-from sin error de permisos)
      - name: Login to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # 2. Compilación nativa pasando la URI limpia de la imagen de caché
      - name: Build OCI Image with Podman
        run: |
          podman build \
            --cache-to=${{ env.IMAGE_NAME }}:buildcache \
            --cache-from=${{ env.IMAGE_NAME }}:buildcache \
            -f Containerfile -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          podman save -o fedora-atomic.tar ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 3. Escaneo no bloqueante para evitar caída por CVEs upstream de Fedora sin parche
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: 'fedora-atomic.tar'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'

      # 4. Despliegue de la imagen final y actualización del tar de caché en GHCR
      - name: Push Verified Image & Build Cache
        run: |
          podman push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          podman push ${{ env.IMAGE_NAME }}:buildcache || true
