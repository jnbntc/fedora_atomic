name: Fedora Atomic Core - Build & SecScan

on:
  push:
    branches:
      - main
    paths:
      - Containerfile
      - .github/workflows/build.yml
      - files/**
  schedule:
    - cron: '17 22 * * *' # 22:17 UTC / 19:17 ART
  workflow_dispatch:

concurrency:
  group: fedora-atomic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fedora_atomic
  CACHE_REPO: ghcr.io/${{ github.repository_owner }}/fedora_atomic/cache
  IMAGE_TAG: latest

jobs:
  # -------------------------------------------------------------------------
  # BUILD: COMPILACIÓN, ESCANEO Y DESPLIEGUE INMUTABLE
  # -------------------------------------------------------------------------
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1. Autenticación OCI temprana
      - name: Login to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      # 2. Compilación con Cache-Buster diario, etiquetas OCI y reintentos
      - name: Build OCI Image with Podman
        run: |
          DATE_TAG=$(date -u +%Y%m%d)
          CACHE_BUSTER="${DATE_TAG}"
          echo "DATE_TAG=${DATE_TAG}" >> "${GITHUB_ENV}"

          cache_args=(--cache-from="${CACHE_REPO}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            cache_args+=(--cache-to="${CACHE_REPO}")
          fi

          n=0
          max=3
          until [ $n -ge $max ]; do
            podman build \
              --pull=always \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.description=Fedora Atomic Core Inmutable" \
              --build-arg CACHE_BUSTER="${CACHE_BUSTER}" \
              "${cache_args[@]}" \
              -f Containerfile \
              -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
              -t ${{ env.IMAGE_NAME }}:${DATE_TAG} . && break
            n=$((n+1))
            echo "::warning::Fallo en la transacción RPM o red. Reintentando en 15 segundos (Intento $n/$max)..."
            sleep 15
          done

          # Validación de integridad del artefacto antes de exportar
          podman image exists ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || exit 1

          # Exportación temporal para el escaneo local
          podman save --format docker-archive -o fedora-atomic.tar ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # 3. Escaneo advisory actual. En Etapa 5 se reemplazará por validación
      #    compatible con Fedora/OSTree + SBOM y política de bloqueo explícita.
      - name: Run Trivy Vulnerability Scanner (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: 'fedora-atomic.tar'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os'
          scanners: 'vuln'
          severity: 'CRITICAL,HIGH'

      # 4. Despliegue unificado de tags inmutables y flotantes post-build
      - name: Push Built Image
        if: github.ref == 'refs/heads/main'
        run: |
          podman push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          podman push ${{ env.IMAGE_NAME }}:${{ env.DATE_TAG }}