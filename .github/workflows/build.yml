name: Fedora Atomic Core - Build & SecScan

on:
  push:
    branches:
      - main
    paths:
      - Containerfile
      - .github/workflows/build.yml
      - files/**
      - security/**
      - scripts/security/**
  schedule:
    - cron: '17 22 * * *' # 22:17 UTC / 19:17 ART
  workflow_dispatch:

concurrency:
  group: fedora-atomic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fedora_atomic
  CACHE_REPO: ghcr.io/${{ github.repository_owner }}/fedora_atomic/cache
  IMAGE_TAG: latest

jobs:
  # -------------------------------------------------------------------------
  # BUILD: COMPILACIÓN, EVIDENCIA DE SEGURIDAD, GATE Y PUBLICACIÓN
  # -------------------------------------------------------------------------
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1. Autenticación OCI temprana
      - name: Login to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      # 2. Compilación con cache-buster diario, etiquetas OCI y reintentos
      - name: Build OCI Image with Podman
        shell: bash
        run: |
          set -Eeuo pipefail

          DATE_TAG="$(date -u +%Y%m%d)"
          CACHE_BUSTER="${DATE_TAG}"
          echo "DATE_TAG=${DATE_TAG}" >> "${GITHUB_ENV}"

          cache_args=(--cache-from="${CACHE_REPO}")
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            cache_args+=(--cache-to="${CACHE_REPO}")
          fi

          n=0
          max=3
          until [[ $n -ge $max ]]; do
            if podman build \
              --pull=always \
              --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --label "org.opencontainers.image.description=Fedora Atomic Core Inmutable" \
              --build-arg CACHE_BUSTER="${CACHE_BUSTER}" \
              "${cache_args[@]}" \
              -f Containerfile \
              -t "${IMAGE_NAME}:${IMAGE_TAG}" \
              -t "${IMAGE_NAME}:${DATE_TAG}" .; then
              break
            fi

            n=$((n + 1))
            if [[ $n -ge $max ]]; then
              echo "::error::Build falló tras ${max} intentos."
              exit 1
            fi

            echo "::warning::Fallo en la transacción RPM o red. Reintentando en 15 segundos (Intento $((n + 1))/${max})..."
            sleep 15
          done

          podman image exists "${IMAGE_NAME}:${IMAGE_TAG}"

      # 3. Exportamos el rootfs real. El docker-archive anterior no exponía
      #    correctamente la semántica Fedora/OSTree a los scanners.
      - name: Export Squashed Rootfs
        shell: bash
        run: |
          set -Eeuo pipefail

          cid="$(podman create "${IMAGE_NAME}:${IMAGE_TAG}")"
          trap 'podman rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          mkdir -p rootfs security-evidence
          podman export "$cid" | tar -x -C rootfs

          test -f rootfs/usr/lib/os-release
          test -f rootfs/usr/share/rpm/rpmdb.sqlite

      # 4. SBOM reproducible: Syft queda pinneado y una única catalogación
      #    genera los dos formatos estándar que conservamos como evidencia.
      - name: Download Pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0

      - name: Generate SPDX and CycloneDX SBOMs
        shell: bash
        run: |
          set -Eeuo pipefail

          "${{ steps.syft.outputs.cmd }}" dir:rootfs \
            -o spdx-json=security-evidence/sbom.spdx.json \
            -o cyclonedx-json=security-evidence/sbom.cyclonedx.json

          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' \
            security-evidence/sbom.spdx.json >/dev/null

          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
            security-evidence/sbom.cyclonedx.json >/dev/null

          rpm_packages="$(
            jq '[
              .packages[]?
              | select(any(.externalRefs[]?;
                  .referenceType == "purl"
                  and (.referenceLocator | startswith("pkg:rpm/"))
                ))
            ] | length' security-evidence/sbom.spdx.json
          )"

          echo "RPM packages cataloged by Syft: ${rpm_packages}"
          (( rpm_packages > 0 ))

          {
            echo "### SBOM"
            echo
            echo "- SPDX packages: **$(jq '.packages | length' security-evidence/sbom.spdx.json)**"
            echo "- RPM packages: **${rpm_packages}**"
            echo "- CycloneDX components: **$(jq '.components | length' security-evidence/sbom.cyclonedx.json)**"
          } >> "${GITHUB_STEP_SUMMARY}"

      # 5. Grype complementa el gate Fedora con visibilidad de dependencias
      #    embebidas (Go/Python/CPE). No decide si se publica la imagen.
      - name: Grype Dependency Scan (advisory)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: security-evidence/sbom.spdx.json
          fail-build: false
          output-format: json
          output-file: security-evidence/grype-advisory.json
          by-cve: true
          cache-db: true
          grype-version: v0.119.0

      - name: Summarize Grype Advisory Scan
        shell: bash
        run: |
          set -Eeuo pipefail

          total="$(jq '.matches | length' security-evidence/grype-advisory.json)"
          critical="$(jq '[.matches[]? | select(.vulnerability.severity == "Critical")] | length' security-evidence/grype-advisory.json)"
          high="$(jq '[.matches[]? | select(.vulnerability.severity == "High")] | length' security-evidence/grype-advisory.json)"

          {
            echo "### Grype complementary scan"
            echo
            echo "- Total matches: **${total}**"
            echo "- Critical: **${critical}**"
            echo "- High: **${high}**"
            echo
            echo "_Este reporte es advisory para dependencias embebidas; el gate del SO usa metadata nativa de Fedora._"
          } >> "${GITHUB_STEP_SUMMARY}"

      # 6. Gate Fedora-native: consultamos updateinfo/advisory contra el rpmdb
      #    exacto de la imagen construida. Critical e Important bloquean.
      - name: Query Fedora Security Advisories
        shell: bash
        run: |
          set -Eeuo pipefail

          expected_name="$(jq -r '.expected_distro.name' security/vulnerability-policy.json)"
          expected_version="$(jq -r '.expected_distro.version' security/vulnerability-policy.json)"

          podman run --rm \
            -e EXPECTED_NAME="${expected_name}" \
            -e EXPECTED_VERSION="${expected_version}" \
            -v "${PWD}/security-evidence:/evidence" \
            "${IMAGE_NAME}:${IMAGE_TAG}" \
            bash -lc '
              set -Eeuo pipefail
              . /usr/lib/os-release

              [[ "$ID" == "$EXPECTED_NAME" ]]
              [[ "$VERSION_ID" == "$EXPECTED_VERSION" ]]
              test -f /usr/share/rpm/rpmdb.sqlite
              command -v dnf5 >/dev/null

              dnf5 --refresh advisory list \
                --available \
                --security \
                --with-cve \
                --json > /evidence/fedora-security-advisories.json
            '

      # La evidencia se conserva incluso si el gate siguiente decide bloquear.
      - name: Upload Security Evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            security-evidence/sbom.spdx.json
            security-evidence/sbom.cyclonedx.json
            security-evidence/grype-advisory.json
            security-evidence/fedora-security-advisories.json
          retention-days: 30
          if-no-files-found: error

      - name: Enforce Fedora Security Gate
        shell: bash
        run: |
          bash scripts/security/evaluate-fedora-advisories.sh \
            security-evidence/fedora-security-advisories.json \
            security/vulnerability-policy.json

      # 7. Solo una imagen que pasó el gate puede publicarse.
      - name: Push Built Image
        if: github.ref == 'refs/heads/main'
        run: |
          podman push "${IMAGE_NAME}:${IMAGE_TAG}"
          podman push "${IMAGE_NAME}:${DATE_TAG}"
