name: Immutable Identity Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build.yml
      - .github/workflows/identity-validate.yml
      - scripts/publish/**
      - scripts/tests/test-publish-identity.sh
      - scripts/cleanup-ghcr.sh
      - scripts/tests/test-cleanup-ghcr.sh

jobs:
  validate-identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bash syntax
        run: |
          bash -n scripts/publish/publish-image.sh
          bash -n scripts/tests/test-publish-identity.sh

      - name: ShellCheck
        run: |
          shellcheck scripts/publish/publish-image.sh
          shellcheck scripts/tests/test-publish-identity.sh

      - name: Identity unit tests
        run: bash scripts/tests/test-publish-identity.sh

      - name: Cleanup regression tests
        run: bash scripts/tests/test-cleanup-ghcr.sh
