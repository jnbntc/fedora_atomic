name: Stage 5 Fedora Advisory Probe

on:
  push:
    branches:
      - security/stage-5-sbom-rootfs
    paths:
      - .github/workflows/stage5-fedora-advisory-probe.yml

concurrency:
  group: stage5-fedora-advisory-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull current production image
        run: podman pull ghcr.io/${{ github.repository_owner }}/fedora_atomic:latest

      - name: Probe Fedora advisory metadata
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p security-probe

          podman run --rm \
            -v "${PWD}/security-probe:/work" \
            ghcr.io/${{ github.repository_owner }}/fedora_atomic:latest \
            bash -lc '
              set -Eeuo pipefail
              echo "--- dnf binaries ---"
              command -v dnf5 || true
              command -v dnf || true
              dnf5 --version || true

              echo "--- rpmdb ---"
              test -f /usr/share/rpm/rpmdb.sqlite
              rpm -qa | wc -l

              echo "--- Fedora security advisories available ---"
              dnf5 --refresh advisory list \
                --available \
                --security \
                --with-cve \
                --json > /work/fedora-security-advisories.json

              jq "{
                rows: length,
                severities: (
                  group_by(.advisory_severity)
                  | map({key: .[0].advisory_severity, value: length})
                  | from_entries
                ),
                advisories: ([.[].advisory_name] | unique | length),
                cves: (
                  [.[].references[]?
                   | select(.reference_type == \"cve\")
                   | .reference_id]
                  | unique
                  | length
                )
              }" /work/fedora-security-advisories.json
            '

      - name: Show Critical and Important advisories
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -r '
            .[]
            | select(
                (.advisory_severity | ascii_downcase) == "critical"
                or (.advisory_severity | ascii_downcase) == "important"
              )
            | [
                .advisory_severity,
                .advisory_name,
                .nevra,
                ([.references[]?
                  | select(.reference_type == "cve")
                  | .reference_id]
                 | unique
                 | join(","))
              ]
            | @tsv
          ' security-probe/fedora-security-advisories.json | sort -u | head -200
