name: Stage 5 Grype Rootfs Probe

on:
  push:
    branches:
      - security/stage-5-sbom-rootfs
    paths:
      - .github/workflows/stage5-grype-rootfs-probe.yml

concurrency:
  group: stage5-grype-rootfs-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR via Podman
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull current production image
        run: podman pull ghcr.io/${{ github.repository_owner }}/fedora_atomic:latest

      - name: Export squashed rootfs
        shell: bash
        run: |
          set -Eeuo pipefail
          cid="$(podman create ghcr.io/${{ github.repository_owner }}/fedora_atomic:latest)"
          trap 'podman rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p rootfs
          podman export "$cid" | tar -x -C rootfs
          test -f rootfs/usr/share/rpm/rpmdb.sqlite

      - name: Scan rootfs directly with Grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: rootfs
          fail-build: false
          output-format: json
          output-file: grype-rootfs-report.json
          by-cve: true
          cache-db: true

      - name: Summarize direct rootfs scan
        shell: bash
        run: |
          set -Eeuo pipefail

          jq '{
            distro: .distro,
            total_matches: (.matches | length),
            rpm_matches: ([.matches[]? | select(.artifact.type == "rpm")] | length),
            distro_matches: ([.matches[]? | select(.vulnerability.namespace | startswith("fedora"))] | length),
            by_severity: {
              critical: ([.matches[]? | select(.vulnerability.severity == "Critical")] | length),
              high: ([.matches[]? | select(.vulnerability.severity == "High")] | length),
              medium: ([.matches[]? | select(.vulnerability.severity == "Medium")] | length)
            },
            fedora_fixable_high_critical: ([
              .matches[]?
              | select(
                  (.vulnerability.namespace | startswith("fedora"))
                  and (.artifact.type == "rpm")
                  and (.vulnerability.fix.state == "fixed")
                  and (
                    .vulnerability.severity == "Critical"
                    or .vulnerability.severity == "High"
                  )
                )
            ] | length),
            namespaces: ([.matches[]?.vulnerability.namespace] | unique)
          }' grype-rootfs-report.json

          echo '--- Fedora RPM HIGH/CRITICAL fixables ---'
          jq -r '
            .matches[]?
            | select(
                (.vulnerability.namespace | startswith("fedora"))
                and (.artifact.type == "rpm")
                and (.vulnerability.fix.state == "fixed")
                and (
                  .vulnerability.severity == "Critical"
                  or .vulnerability.severity == "High"
                )
              )
            | [
                .vulnerability.severity,
                .vulnerability.id,
                .artifact.name,
                .artifact.version,
                (.vulnerability.fix.versions | join(","))
              ]
            | @tsv
          ' grype-rootfs-report.json | sort -u | head -100
