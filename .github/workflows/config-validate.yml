name: Config Tree Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - Containerfile
      - files/**
      - scripts/tests/test-config-tree.sh
      - .github/workflows/config-validate.yml
  workflow_dispatch:

jobs:
  validate-config-tree:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bash syntax
        run: bash -n scripts/tests/test-config-tree.sh

      - name: ShellCheck
        run: shellcheck scripts/tests/test-config-tree.sh

      - name: Validate declarative config tree
        run: bash scripts/tests/test-config-tree.sh
