name: Artifact Smoke Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - Containerfile
      - .github/workflows/build.yml
      - .github/workflows/smoke-validate.yml
      - scripts/smoke/**
      - scripts/tests/test-smoke-contract.sh
      - files/**

jobs:
  validate-smoke-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bash syntax
        run: |
          bash -n scripts/smoke/test-image.sh
          bash -n scripts/tests/test-smoke-contract.sh

      - name: ShellCheck
        run: |
          shellcheck scripts/smoke/test-image.sh
          shellcheck scripts/tests/test-smoke-contract.sh

      - name: Validate smoke contract
        run: bash scripts/tests/test-smoke-contract.sh
