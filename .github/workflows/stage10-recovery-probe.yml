name: Stage 10 Recovery Drill Probe

on:
  push:
    branches:
      - docs/stage-10-operations-recovery
    paths:
      - .github/workflows/stage10-recovery-probe.yml

jobs:
  drill:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fedora_atomic

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Verify and resolve stable
        id: stable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash scripts/recovery/verify-stable.sh \
            --repository "${IMAGE_NAME}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --evidence-dir recovery-evidence

      - name: Pull exact verified digest
        shell: bash
        run: |
          set -Eeuo pipefail
          digest="${{ steps.stable.outputs.digest }}"
          [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_NAME}@${digest}"
          echo "IMAGE_REF=${image_ref}" >> "${GITHUB_ENV}"
          podman pull "${image_ref}"

      - name: Export recovery rootfs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p recovery-rootfs
          cid="$(podman create "${IMAGE_REF}")"
          trap 'podman rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          podman export "$cid" | tar -x -C recovery-rootfs

      - name: Recovery smoke tests
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/smoke/test-image.sh \
            "${IMAGE_REF}" \
            recovery-rootfs \
            files/etc \
            2>&1 | tee recovery-evidence/artifact-smoke.txt

      - name: Query Fedora security advisories
        shell: bash
        run: |
          set -Eeuo pipefail
          expected_name="$(jq -r '.expected_distro.name' security/vulnerability-policy.json)"
          expected_version="$(jq -r '.expected_distro.version' security/vulnerability-policy.json)"
          podman run --rm \
            -e EXPECTED_NAME="${expected_name}" \
            -e EXPECTED_VERSION="${expected_version}" \
            -v "${PWD}/recovery-evidence:/evidence" \
            "${IMAGE_REF}" \
            bash -lc '
              set -Eeuo pipefail
              . /usr/lib/os-release
              [[ "$ID" == "$EXPECTED_NAME" ]]
              [[ "$VERSION_ID" == "$EXPECTED_VERSION" ]]
              dnf5 --refresh advisory list --available --security --with-cve --json \
                > /evidence/fedora-security-advisories.json
            '

      - name: Enforce Fedora recovery gate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/security/evaluate-fedora-advisories.sh \
            recovery-evidence/fedora-security-advisories.json \
            security/vulnerability-policy.json \
            2>&1 | tee recovery-evidence/fedora-security-gate.txt
